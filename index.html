<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rugby Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f8f9fa;
      color: #0a0a0a;
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      border-bottom: 2px solid #0a0a0a;
      padding-bottom: 10px;
    }

    .title {
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 0.8rem;
      color: #52525b;
    }

    .drill-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .drill-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      background: #ffffff;
      border: 2px solid #0a0a0a;
      box-shadow: 4px 4px 0px #0a0a0a;
      text-decoration: none;
      color: #0a0a0a;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease;
    }

    .drill-card:hover {
      background: #eff6ff;
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px #0a0a0a;
    }

    .drill-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .drill-name {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .drill-desc {
      font-size: 0.78rem;
      color: #52525b;
    }

    .drill-arrow {
      font-size: 1.1rem;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="title">Rugby Lab</h1>
      <p class="subtitle">Decision &amp; Timing Drills</p>
    </header>

    <nav class="drill-list">
      <a href="./2-on-1-lab/" class="drill-card">
        <div class="drill-info">
          <span class="drill-name">2-on-1 Lab</span>
          <span class="drill-desc">10-rep 2-on-1 pass timing vs randomized defender reads</span>
        </div>
        <span class="drill-arrow">&rarr;</span>
      </a>
      <a href="./scrum-half-lab/" class="drill-card">
        <div class="drill-info">
          <span class="drill-name">Scrum-Half Lab</span>
          <span class="drill-desc">10-rep swipe-to-pass service onto a moving line runner (scored /100)</span>
        </div>
        <span class="drill-arrow">&rarr;</span>
      </a>
    </nav>
  </main>
</body>
</html>
